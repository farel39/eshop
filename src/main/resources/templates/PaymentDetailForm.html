<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail Lookup</title>
    <script type="text/javascript">
        function lookupPayment() {
            var paymentId = document.getElementById("paymentId").value;
            if(paymentId) {
                window.location.href = '/payment/detail/' + paymentId;
            }
            return false;
        }
    </script>
</head>
<body>
<h1>Payment Detail Lookup</h1>
<form onsubmit="return lookupPayment();">
    <label for="paymentId">Payment ID:</label>
    <input type="text" id="paymentId" name="paymentId" required/><br/><br/>
    <button type="submit">Lookup Payment</button>
</form>
</body>
</html>
